<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visiting Card</title>
  <meta name="description" content="Digital visiting card. Tap the name to show a QR code that saves the contact.">
  <meta name="theme-color" content="#CB2129">
  <style>
/* One visiting card, brand red #CB2129. Tap the name to show the contact QR.
 *
 * This page may be placed straight into a SharePoint page (Script Editor / Content Editor),
 * so every rule is scoped to .vc-app and nothing styles the portal's own html/body.
 * .vc-app covers the whole screen above the portal page, with the card in the middle. */
.vc-app {
  --bg: #f1f1f3;
  --hint: #6b6f78;
  --red-1: #DA3A2E;
  --red-2: #CB2129;
  --red-3: #8E1320;
  --gold: #F2B84B;
  position: fixed !important;
  inset: 0 !important;
  z-index: 2147483000 !important;
  width: 100% !important;
  height: 100% !important;
  margin: 0 !important;
  padding: 16px !important;
  display: grid !important;
  place-items: center !important;
  overflow: auto !important;
  background: var(--bg) !important;
  -webkit-font-smoothing: antialiased;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  .vc-app { --bg: #121317; --hint: #9a9ea8; }
}

/* Keep the portal's styles out: same font, box model and no stray margins inside the card */
.vc-app, .vc-app *, .vc-app *::before, .vc-app *::after { box-sizing: border-box !important; }
.vc-app, .vc-app * {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif !important;
  letter-spacing: normal;
  text-transform: none;
  text-shadow: none;
}
/* Same strength as one class, placed first: beats portal tag rules (p, h2...), loses to the card's own rules below */
.vc-app :where(p, h2, ul, li) { margin: 0; padding: 0; line-height: normal; }
.vc-app :where(button) { min-width: 0; margin: 0; box-shadow: none; }
.vc-app :where(img) { max-width: none; border: 0; }

/* While the card is open: stop the portal page scrolling behind it */
html.vc-open, html.vc-open body { overflow: hidden !important; }

.vc-stage { width: min(100%, 560px); display: grid; gap: 14px; justify-items: center; }
.vc-hint { margin: 0; color: var(--hint); font-size: 0.85rem !important; text-align: center; }

/* Card: 3.5 x 2 inch ratio. Text scales with card width (cqw units). */
.vcard {
  container-type: inline-size;
  position: relative;
  width: 100%;
  aspect-ratio: 1.75;
  border-radius: 16px;
  overflow: hidden;
  color: #fff;
  /* Wider-than-card gradient that slowly drifts (see @keyframes vc-drift) */
  background: linear-gradient(135deg, var(--red-1) 0%, var(--red-2) 30%, var(--red-3) 55%, var(--red-2) 80%, var(--red-1) 100%);
  background-size: 250% 250%;
  animation: vc-drift 14s ease-in-out infinite alternate;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.18);
}
/* Soft light band that sweeps across the card every few seconds */
.vcard::before {
  content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.16) 48%, rgba(255,255,255,.04) 56%, transparent 66%);
  transform: translateX(-120%);
  animation: vc-shine 7s ease-in-out 1.2s infinite;
}
@keyframes vc-drift {
  0%   { background-position: 0% 0%; }
  100% { background-position: 100% 100%; }
}
@keyframes vc-shine {
  0%, 70% { transform: translateX(-120%); }
  100%    { transform: translateX(120%); }
}
@keyframes vc-float {
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-3cqw, 2cqw) scale(1.06); }
}
.vc-body {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between; /* name at the top, details spread below */
  gap: 3cqw;
  padding: 5.5cqw 6.5cqw;
}
.vc-body::after {
  content: ""; position: absolute; right: -14cqw; top: -18cqw;
  width: 52cqw; height: 52cqw; border-radius: 50%;
  background: rgba(255,255,255,.10); pointer-events: none;
  animation: vc-float 9s ease-in-out infinite alternate;
}
.vc-head { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 3.5cqw; }
.vc-logo { flex: none; height: 16cqw; width: auto; margin-top: -1cqw; }

.vc-name {
  all: unset;
  cursor: pointer;
  display: block;
  font-size: calc(7.8cqw * var(--fit, 1)); line-height: 1.08; font-weight: 700; letter-spacing: -0.015em;
  border-bottom: .3cqw dashed rgba(255,255,255,.5);
}
.vc-name:hover { border-bottom-color: #fff; }
.vc-name:focus-visible { outline: .5cqw solid var(--gold); outline-offset: 1cqw; border-radius: 1cqw; }
.vc-title { margin: 1cqw 0 0; font-size: calc(3.3cqw * var(--fit, 1)); font-weight: 500; color: rgba(255,255,255,.9); }

/* Business and Unit, each with a small gold title above */
.vc-info { position: relative; z-index: 1; display: grid; gap: 2.6cqw; }
.vc-field { display: grid; gap: .9cqw; justify-items: start; min-width: 0; }
.vc-label {
  font-size: calc(2.3cqw * var(--fit, 1)) !important; font-weight: 700; letter-spacing: .14em !important;
  text-transform: uppercase !important; color: var(--gold);
}
.vc-business {
  padding: .8cqw 2.6cqw;
  border-radius: 99px;
  border: .25cqw solid rgba(242,184,75,.7);
  background: rgba(0,0,0,.18);
  font-size: calc(3.4cqw * var(--fit, 1)) !important; font-weight: 600; line-height: 1.25 !important;
  overflow-wrap: anywhere;
}
.vc-value { font-size: calc(3.6cqw * var(--fit, 1)) !important; font-weight: 600; line-height: 1.25 !important; overflow-wrap: anywhere; }
/* When designation and phone are shown too: Business and Unit side by side so all fits */
.vcard.is-full .vc-info { grid-template-columns: 1.3fr 1fr; column-gap: 4cqw; }
.vc-main { position: relative; z-index: 1; display: grid; gap: 2.6cqw; }
.vc-details { position: relative; z-index: 1; list-style: none; margin: 0; padding: 0; display: grid; gap: 1.3cqw; }
.vc-row { display: flex; align-items: flex-start; gap: 2cqw; font-size: calc(3.2cqw * var(--fit, 1)); line-height: 1.35; overflow-wrap: anywhere; }
.vc-row svg { flex: none; width: calc(3.4cqw * var(--fit, 1)); height: calc(3.4cqw * var(--fit, 1)); margin-top: .2cqw; fill: var(--gold); }
.vc-row span { min-width: 0; overflow-wrap: anywhere; }

/* Loading (waiting for portal login details) */
.vcard.is-loading .vc-head > div,
.vcard.is-loading .vc-main { animation: vc-pulse 1s ease-in-out infinite alternate; }
.vcard.is-loading .vc-name { cursor: default; border-bottom-color: transparent; }
@keyframes vc-pulse { from { opacity: .35; } to { opacity: .8; } }
[hidden] { display: none !important; }
.vc-retry {
  min-height: 40px; padding: 8px 18px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--red-2); background: transparent; color: var(--red-2);
  font: inherit; font-weight: 600;
}

/* Flip: tap the name → the card turns over smoothly and shows the QR on its back */
.vc-flip { width: 100%; perspective: 1600px; }
.vc-flip-inner {
  position: relative;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  transition: transform 1s cubic-bezier(.65, .05, .25, 1);
}
.vc-flip.is-flipped .vc-flip-inner { transform: rotateY(180deg); }
/* A small lift while turning, so it feels like a real card in the hand */
.vc-flip.is-turning .vc-flip-inner { animation: vc-lift 1s cubic-bezier(.65, .05, .25, 1); }
@keyframes vc-lift {
  0%, 100% { scale: 1; }
  50%      { scale: 1.06; }
}
.vc-front, .vc-back {
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0.1px); /* helps iPhone Safari hide the face that is turned away */
}

/* Back of the card: white, QR on the left, short text on the right */
.vc-back {
  container-type: inline-size;
  position: absolute; inset: 0;
  transform: rotateY(180deg) translateZ(0.1px);
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
  color: #1c1f26;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.18);
  display: flex; align-items: center; gap: 5cqw;
  padding: 4cqw 6cqw 4cqw 4cqw;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.vc-back::after { /* thin brand stripe along the bottom */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.6cqw;
  background: linear-gradient(90deg, var(--red-1), var(--red-2), var(--red-3));
}
.vc-back:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
#qr-code { position: relative; flex: none; height: 100%; aspect-ratio: 1; }
#qr-code svg { width: 100%; height: 100%; display: block; }
.vc-back-text { display: grid; gap: 1.6cqw; min-width: 0; }
.vc-back-title { font-size: 4.6cqw !important; font-weight: 700; color: var(--red-2); line-height: 1.15 !important; }
.vc-back-name { font-size: 3.6cqw !important; font-weight: 600; overflow-wrap: anywhere; }
.vc-back-hint { font-size: 2.8cqw !important; color: #6b6f78; line-height: 1.3 !important; }

/* After the turn: a red line scans down the QR once */
.vc-flip.is-flipped #qr-code::after {
  content: ""; position: absolute; left: 3%; right: 3%; top: 0; height: 3px; border-radius: 3px;
  background: var(--red-2); box-shadow: 0 0 12px 2px rgba(203,33,41,.55);
  animation: qr-scan .9s ease-in-out .85s both;
}
@keyframes qr-scan {
  0%   { top: 0; opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { top: calc(100% - 3px); opacity: 0; }
}

/* Respect "reduce motion" phone/computer setting */
@media (prefers-reduced-motion: reduce) {
  .vcard, .vcard::before, .vc-body::after,
  .vc-flip.is-turning .vc-flip-inner, .vc-flip.is-flipped #qr-code::after,
  .vcard.is-loading .vc-head > div, .vcard.is-loading .vc-main { animation: none !important; }
  .vc-flip-inner { transition: none !important; }  /* turn over instantly */
  .vcard::before, .vc-flip.is-flipped #qr-code::after { display: none; }
}
  </style>
</head>

          <div>

  <script>
/*
 * Fills the card from the portal login (SharePoint, Azure) and shows the contact QR
 * when the name is tapped.
 * The QR holds the contact itself (vCard), so the other phone's camera offers
 * "Add to Contacts" with no internet and no website needed.
 */
(function () {
  "use strict";

  var cfg = window.VC_CONFIG || {};
  var card = {};

  /* ---------- Show only the card: hide the portal page around it ----------
   * Works when this file is placed straight into a SharePoint page (Script Editor /
   * Content Editor) and when it runs inside a Page Viewer iframe. */
  var appEl = document.getElementById("vc-app");
  var hostDoc = portalDoc();
  var inFrame = hostDoc !== document;
  var keepEl = inFrame ? window.frameElement : appEl; // the one thing that must stay visible

  // Known portal parts (same list as the Geo attendance app) + SharePoint ribbon/title rows.
  var HOST_PARTS = [
    "#ms-cui-topBar2", ".ms-cui-topBar2", "#suiteBarDelta", "#suiteBarTop", "#s4-ribbonrow", "#s4-titlerow",
    ".ms-dialogHidden.ms-fullWidth.noindex", ".ms-webpart-titleText", ".ms-webpart-chrome-title",
    ".navbar.navbar-static-top", ".pageTitle", ".myabg_share-icon", ".icon.icon-pin", ".abg_userpic",
    ".myapp_sec", ".myapps", ".footer", "#globalNavBox", ".box-shadow-none.dropdown-toggle.arrow_indicator3",
    "#back-to-top"
  ];

  function takeOverScreen() {
    try {
      var css = HOST_PARTS.join(",\n") + " { display: none !important; }\n" +
                "html.vc-open, html.vc-open body { overflow: hidden !important; }\n";
      if (!inFrame) {
        // Move the card to the top of the page so no portal wrapper can push or clip it,
        // then hide every other part of the page (header, My Apps, chatbot, footer...).
        if (appEl.parentNode !== document.body) document.body.appendChild(appEl);
        css += "body > *:not(#vc-app):not(script):not(style):not(link) { display: none !important; }\n";
      } else {
        // Inside an iframe: stretch the iframe over the whole screen.
        var f = window.frameElement.style;
        ["position:fixed", "top:0", "left:0", "width:100%", "height:100%", "border:0", "margin:0",
         "z-index:2147483000", "background:transparent"].forEach(function (rule) {
          var kv = rule.split(":"); f.setProperty(kv[0], kv[1], "important");
        });
      }
      var st = hostDoc.getElementById("vc-host-style") || hostDoc.createElement("style");
      st.id = "vc-host-style";
      st.textContent = css;
      (hostDoc.head || hostDoc.documentElement).appendChild(st);
      hostDoc.documentElement.classList.add("vc-open");
      hideFloaters();
      watchFloaters();
    } catch (e) { /* if the page blocks this, the card still works */ }
  }

  // Hide anything that floats over the page (chatbot bubble, APPS tab...), even if it loads later.
  function hideFloaters() {
    var win = hostDoc.defaultView, all = hostDoc.body ? hostDoc.body.getElementsByTagName("*") : [];
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el === keepEl || keepEl.contains(el) || el.contains(keepEl)) continue;
      var pos = win.getComputedStyle(el).position;
      if (pos === "fixed" || pos === "sticky") el.style.setProperty("display", "none", "important");
    }
  }

  function watchFloaters() {
    if (!window.MutationObserver || !hostDoc.body) return;
    var pending = null;
    var obs = new MutationObserver(function () {
      if (pending) return;
      pending = setTimeout(function () { pending = null; hideFloaters(); }, 250);
    });
    obs.observe(hostDoc.body, { childList: true, subtree: true });
    setTimeout(function () { obs.disconnect(); }, 30000); // chatbots load within seconds; stop watching after 30 s
  }

  function setText(id, value) {
    document.getElementById(id).textContent = value || ""; // textContent: never inject HTML
  }

  function vcfEscape(v) {
    return String(v || "")
      .replace(/\\/g, "\\\\")
      .replace(/\n/g, "\\n")
      .replace(/,/g, "\\,")
      .replace(/;/g, "\\;");
  }

  /* Short vCard 3.0: fewer characters → fewer, bigger QR squares → easier to scan. */
  function toVCard(d) {
    var parts = String(d.name || "").trim().split(/\s+/);
    var last = parts.length > 1 ? parts.pop() : "";
    var lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + vcfEscape(last) + ";" + vcfEscape(parts.join(" ")) + ";;;",
      "FN:" + vcfEscape(d.name)
    ];
    if (d.designation) lines.push("TITLE:" + vcfEscape(d.designation));
    if (d.business) lines.push("ORG:" + vcfEscape(d.business));
    if (d.phone) lines.push("TEL:" + String(d.phone).replace(/[^\d+]/g, ""));
    if (d.email) lines.push("EMAIL:" + vcfEscape(String(d.email).trim()));
    if (d.address) lines.push("ADR:;;" + vcfEscape(d.address) + ";;;;");
    lines.push("END:VCARD");
    return lines.join("\r\n");
  }

  function qrSvg(text) {
    var qr = window.qrcode(0, "L"); // level L: most room for text, biggest squares
    qr.addData(text);
    qr.make();
    return qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); // white card back gives the quiet zone
  }

  /* ---------- Clean values before showing them (text only, sensible length) ---------- */
  function clean(v, max) {
    return String(v || "").replace(/[\u0000-\u001f\u007f<>]/g, " ").replace(/\s+/g, " ").trim().slice(0, max || 120);
  }
  function cleanName(v) {
    v = clean(v, 60);
    return /^[A-Za-z][A-Za-z .'-]{1,59}$/.test(v) ? v : "";
  }
  function cleanEmail(v) {
    v = clean(v, 120);
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? v : "";
  }
  function cleanPhone(v) {
    v = clean(v, 20);
    return /^\+?[\d\s-]{6,20}$/.test(v) ? v : "";
  }
  /* "prasidha.jagtap@company.com" → "Prasidha Jagtap" (used only if the name field is empty) */
  function nameFromEmail(email) {
    var prefix = String(email || "").split("@")[0];
    if (!prefix || /^\d+$/.test(prefix)) return "";
    return prefix.replace(/[._-]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  /* ---------- Fill the card ---------- */
  var cardEl = document.getElementById("card");
  var nameBtn = document.getElementById("name");
  var statusEl = document.getElementById("status");
  var retryBtn = document.getElementById("retry");

  function fill(d) {
    card = d;
    setText("name", d.name);
    setText("designation", d.designation);
    setText("business", d.business);
    setText("phone", d.phone);
    setText("email", d.email);
    setText("address", d.address);
    // Hide anything we don't have (e.g. designation/phone until master data is connected)
    document.getElementById("designation").hidden = !d.designation;
    document.getElementById("field-business").hidden = !d.business;
    cardEl.classList.toggle("is-full", !!(d.designation || d.phone));
    document.getElementById("row-phone").hidden = !d.phone;
    document.getElementById("row-email").hidden = !d.email;
    document.getElementById("row-address").hidden = !d.address;
    document.title = (d.name ? d.name + " – " : "") + "Visiting Card";
    built = false;
    cardEl.classList.remove("is-loading");
    fitText();
    nameBtn.disabled = false;
    statusEl.textContent = "Tap the name to show the QR code";
    retryBtn.hidden = true;
  }

  // Hide the detail lines while there is nothing to show (loading / error)
  function hideDetails() {
    ["designation", "field-business", "row-phone", "row-email", "row-address"].forEach(function (id) {
      document.getElementById(id).hidden = true;
    });
  }

  /* Long names or business names: shrink the text step by step until everything fits on the card */
  function fitText() {
    var body = cardEl.querySelector(".vc-body");
    var parts = body.querySelectorAll(".vc-head, .vc-main");
    function tooBig() {
      var b = body.getBoundingClientRect(), cs = getComputedStyle(body);
      var bottom = b.bottom - parseFloat(cs.paddingBottom), right = b.right - parseFloat(cs.paddingRight);
      for (var i = 0; i < parts.length; i++) {
        var r = parts[i].getBoundingClientRect();
        if (r.bottom > bottom + 1 || r.right > right + 1) return true;
      }
      return body.scrollHeight > body.clientHeight + 1;
    }
    var fit = 1;
    cardEl.style.setProperty("--fit", "1");
    while (fit > 0.6 && tooBig()) {
      fit = Math.round((fit - 0.05) * 100) / 100;
      cardEl.style.setProperty("--fit", String(fit));
    }
  }
  // Card size changes with the screen, but the text is sized to the card; re-check once fonts are ready
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (card.name) fitText(); });

  function showLoading() {
    hideDetails();
    cardEl.classList.add("is-loading");
    nameBtn.disabled = true;
    setText("name", "Loading…");
    retryBtn.hidden = true;
    statusEl.textContent = "Reading your login details…";
  }

  function showError(msg) {
    hideDetails();
    cardEl.classList.remove("is-loading");
    nameBtn.disabled = true;
    setText("name", "—");
    statusEl.textContent = msg;
    retryBtn.hidden = false;
  }

  /* ---------- Portal (Azure login) ---------- */
  // The card may run inside an iframe (Page Viewer web part) or directly on the portal page.
  function portalDoc() {
    try {
      if (window.parent && window.parent !== window && window.parent.document) return window.parent.document;
    } catch (e) { /* different site: cannot read parent */ }
    return document;
  }

  // Find a hidden field by class (e.g. class="hdnBuUnitDesc"), then by id/name ending.
  function field(doc, key) {
    var el = doc.querySelector("input." + key) ||
             doc.querySelector('input[id$="' + key + '"]') ||
             doc.querySelector('input[name$="' + key + '"]');
    return el ? el.value : "";
  }

  function readPortal() {
    var doc = portalDoc(), f = cfg.portalFields || {};
    var email = cleanEmail(field(doc, f.email));
    return {
      name: cleanName(field(doc, f.name)) || cleanName(nameFromEmail(email)),
      email: email,
      business: clean(field(doc, f.business), 120),
      address: clean(field(doc, f.address), 160),
      poornataId: (/^\d{3,12}$/.test(field(doc, f.poornataId).trim()) ? field(doc, f.poornataId).trim() : ""),
      designation: "",
      phone: ""
    };
  }

  /* Master data (Designation, Contact number). Returns {} until cfg.masterData.url is set. */
  function loadMasterData(poornataId) {
    var url = cfg.masterData && cfg.masterData.url;
    if (!url || !poornataId || !window.fetch) return Promise.resolve({});
    return fetch(url.replace("{id}", encodeURIComponent(poornataId)), { credentials: "include" })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; });
  }

  function startPortal() {
    showLoading();
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      var d = readPortal();
      if (d.name && (d.email || d.poornataId)) {
        clearInterval(timer);
        loadMasterData(d.poornataId).then(function (m) {
          d.designation = clean(m && m.designation, 80);
          d.phone = cleanPhone(m && m.phone);
          delete d.poornataId; // not shown, not put in the QR
          fill(d);
        });
      } else if (tries >= (cfg.pollMaxTries || 15)) {
        clearInterval(timer);
        showError("Could not read your login details. Please sign in to the portal and try again.");
      }
    }, cfg.pollMs || 400);
  }

  retryBtn.addEventListener("click", startPortal);

  var built = false;
  takeOverScreen();
  startPortal();

  /* ---------- Flip the card: front (details) ⇄ back (QR) ---------- */
  var flipEl = document.getElementById("flip");
  var backEl = document.getElementById("card-back");
  var qrBox = document.getElementById("qr-code");
  var turnTimer = null;

  function turn(toBack) {
    if (toBack === flipEl.classList.contains("is-flipped")) return;
    flipEl.classList.remove("is-turning");
    void flipEl.offsetWidth;            // restart the lift animation
    flipEl.classList.add("is-turning");
    clearTimeout(turnTimer);
    turnTimer = setTimeout(function () { flipEl.classList.remove("is-turning"); }, 1050);
    flipEl.classList.toggle("is-flipped", toBack);
    // Only the side facing the viewer can be reached by keyboard / screen readers
    backEl.setAttribute("aria-hidden", toBack ? "false" : "true");
    backEl.tabIndex = toBack ? 0 : -1;
    cardEl.setAttribute("aria-hidden", toBack ? "true" : "false");
    nameBtn.tabIndex = toBack ? -1 : 0;
    statusEl.textContent = toBack ? "Tap the card to turn it back" : "Tap the name to show the QR code";
    (toBack ? backEl : nameBtn).focus({ preventScroll: true });
  }

  function showQr() {
    if (nameBtn.disabled || !card.name) return;
    if (!built) {
      qrBox.innerHTML = qrSvg(toVCard(card)); // SVG made by the QR library, not from user text
      qrBox.firstChild.setAttribute("role", "img");
      qrBox.firstChild.setAttribute("aria-label", "QR code with contact details of " + (card.name || ""));
      setText("back-name", card.name);
      built = true;
    }
    turn(true);
  }

  nameBtn.addEventListener("click", showQr);
  backEl.addEventListener("click", function () { turn(false); });
  backEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " " || e.key === "Escape") { e.preventDefault(); turn(false); }
  });
})();
  </script>
</body>
</html>
